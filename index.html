<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101218">
<title>게임 모음</title>
<style>
  :root { --bg: #101218; --card: #1a1e28; --line: #2a3040; --text: #e9ecf3; --muted: #8b93a7; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-user-select: none; user-select: none; }
  main { max-width: 1100px; margin: 0 auto;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); }
  h1 { font-size: 28px; margin: 8px 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  a.game { display: flex; flex-direction: column; gap: 6px; padding: 22px; min-height: 150px;
    background: var(--card); border: 2px solid var(--line); border-left: 6px solid var(--c);
    border-radius: 18px; color: inherit; text-decoration: none; }
  a.game:active { transform: scale(0.98); }
  .icon { font-size: 40px; }
  .name { font-size: 21px; font-weight: 800; }
  .desc { font-size: 14px; color: var(--muted); line-height: 1.4; }
</style>
</head>
<body>
<main>
  <h1>🎮 게임 모음</h1>
  <div class="grid">
    <a class="game" style="--c:#b48cff" href="dimension-thief/">
      <span class="icon">🦹</span><span class="name">차원 도둑</span>
      <span class="desc">1인용 로그라이크 덱빌딩 · 가로 화면</span></a>
    <a class="game" style="--c:#4cc35a" href="monster-lab/">
      <span class="icon">🧪</span><span class="name">몬스터 연구소</span>
      <span class="desc">몬스터 수집·육성·합성 · 가로 화면 (개발 중)</span></a>
    <a class="game" style="--c:#ff4b58" href="hantang/">
      <span class="icon">📈</span><span class="name">한탕 증권</span>
      <span class="desc">주식·레버리지·카지노 시뮬레이션</span></a>
    <a class="game" style="--c:#f5c542" href="hantang/casino.html">
      <span class="icon">🎰</span><span class="name">한탕 카지노 LIVE</span>
      <span class="desc">친구들과 실시간 룰렛·블랙잭</span></a>
    <a class="game" style="--c:#3fd0a8" href="air-hockey/">
      <span class="icon">🏒</span><span class="name">Touch Duel</span>
      <span class="desc">2인용 에어하키 · 반응속도 대결</span></a>
    <a class="game" style="--c:#2fe3ff" href="fft/step1.html">
      <span class="icon">〰️</span><span class="name">FFT 튜터</span>
      <span class="desc">DFT/FFT 단계별 학습</span></a>
  </div>
</main>
</body>
</html>
